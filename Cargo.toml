[package]
name = "scrollsound"
version = "1.25.0"
edition = "2021"
description = "Scroll-wheel volume control over the taskbar"
license = "Anti-996"

[[bin]]
name = "ScrollSound"
path = "src/main.rs"

[profile.release]
opt-level = "z"       # 优化代码尺寸
lto = true            # 启用链接时优化 (Link Time Optimization)
codegen-units = 1     # 降低代码生成单元数，增加优化时间但减少二进制大小
panic = "abort"       # 使用 'abort' 而不是 'unwind' 来处理 panic
strip = "debuginfo"   # 移除调试信息

[dependencies]
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem"] }
windows-version = "0.1.7"

[build-dependencies]
embed-resource = "3.0.11"
